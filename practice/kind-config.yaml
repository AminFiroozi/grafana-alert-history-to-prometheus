# Practice env2: single-node kind cluster "ahpractice".
# NodePorts are published on the host loopback only.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ahpractice
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    extraPortMappings:
      - containerPort: 30990   # Prometheus NodePort
        hostPort: 29190
        listenAddress: 127.0.0.1
      - containerPort: 30301   # env2 Grafana NodePort
        hostPort: 23101
        listenAddress: 127.0.0.1
