# env2 Grafana 12.1.1, for viewing results and for phase 6 practice.
# Datasource and the "Alert state history (backfilled)" dashboard are provisioned.
# The dashboard JSON lives in ../grafana/alert-history-dashboard.json; up.sh turns it into
# the ConfigMap grafana-dashboards (create it first if you apply this file by hand).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: env2-prometheus
        type: prometheus
        uid: env2prom
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
        jsonData:
          # Required for phase 6: without it Grafana 12.1 assumes Mimir and posts to /api/v1/push
          prometheusType: Prometheus
          prometheusVersion: 3.5.0
          timeInterval: 15s
      - name: TestData
        type: grafana-testdata-datasource
        uid: testdata
        access: proxy
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: alert-history
        folder: Alert history
        type: file
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - name: web
      port: 3000
      targetPort: 3000
      nodePort: 30301
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: labadmin
            - name: GF_DATAPROXY_TIMEOUT
              value: "120"
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            periodSeconds: 5
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
